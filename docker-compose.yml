  chroma:
    image: chromadb/chroma:latest
    container_name: chroma-eino
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma  # 使用命名卷，不再写~/路径
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/api/v1/heartbeat || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - common-app-net

  minio:
    image: minio/minio:latest
    container_name: minio-server
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=12345678
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: milvus-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
      - TZ=Asia/Shanghai
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    ports:
      - "2379:2379"
    networks:
      - common-app-net
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Milvus 核心服务
  milvus:
    image: milvusdb/milvus:v2.6.20
    container_name: milvus-standalone
    depends_on:
      etcd:
        condition: service_healthy
      # 注意：依赖你已有的 minio 服务
      minio:
        condition: service_started
    environment:
      # etcd 配置
      ETCD_ENDPOINTS: etcd:2379
      # MinIO 配置（使用你已有的 minio 服务）
      MINIO_ADDRESS: minio-server:9000
      MINIO_ACCESS_KEY_ID: admin
      MINIO_SECRET_ACCESS_KEY: 12345678
      MINIO_USE_SSL: "false"
      MINIO_BUCKET_NAME: milvus-bucket
      # Milvus 自身配置
      TZ: Asia/Shanghai
      # 使用 Standalone 模式
      STANDALONE_ENABLED: "true"
    ports:
      - "19530:19530"   # Milvus 客户端连接端口
      - "9091:9091"     # Milvus WebUI 和管理端口
    volumes:
      - milvus_data:/var/lib/milvus
    command: ["milvus", "run", "standalone"]
    networks:
      - common-app-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 90s

volumes:
  mysql_data:
  redis_data:
